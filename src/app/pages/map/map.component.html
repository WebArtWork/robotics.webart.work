<section class="map-page">
	<div class="map-page__layout">
		<div class="map-page__canvas">
			<app-leaflet-map
				[center]="center()"
				[zoom]="zoom"
				[markers]="markers()"
				(markerSelected)="onMarkerSelected($event)"
			/>

			@if (!markers().length) {
			<p class="map-page__empty" translate>Немає роботів із координатами.</p>
			}
		</div>

		@if (selected(); as robot) {
		<p-card class="map-page__panel">
			<div class="map-page__panel-header">
				<span class="map-page__panel-title" translate>Обраний робот</span>
				<p-button
					icon="pi pi-times"
					[text]="true"
					[rounded]="true"
					severity="secondary"
					(onClick)="closePanel()"
				/>
			</div>

			<app-robot-short [entity]="robot" />

			<p-button
				class="map-page__panel-action"
				label="Переглянути робота"
				icon="pi pi-arrow-right"
				iconPos="right"
				(onClick)="view(robot)"
			/>
		</p-card>
		}
	</div>
</section>
