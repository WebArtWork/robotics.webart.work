<section class="editor">
	<p-card header="Редактор">
		<div class="editor__picker">
			<p-selectbutton
				[options]="options"
				optionLabel="label"
				optionValue="value"
				[ngModel]="selectedType()"
				(ngModelChange)="selectedType.set($event)"
			/>
		</div>

		@switch (selectedType()) {
			@case ('robot') {
				<app-robot-form />
			}
			@case ('robot-record') {
				<app-robot-record-form />
			}
		}

		<div class="editor__actions">
			<button pButton type="button" translate (click)="wValidate()">Перевірити</button>
		</div>
	</p-card>
</section>
