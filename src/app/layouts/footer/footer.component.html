<footer
	class="border-t border-[var(--c-border)] bg-[var(--c-bg-secondary)] text-[var(--c-text-secondary)]"
>
	<div class="mx-auto w-full max-w-[var(--container)] px-5 py-6 max-md:px-3">
		<div class="grid gap-6 lg:grid-cols-[0.9fr_1.1fr]">
			<div class="min-w-0">
				<div class="flex items-center gap-3">
					@if (companyService.company().image) {
					<img
						[src]="companyService.company().image"
						[attr.alt]="companyService.company().name"
						class="block h-9 w-auto object-contain"
					/>
					}

					<div
						class="text-base font-semibold text-[var(--c-text-primary)]"
					>
						{{ metaTitle }}
					</div>
				</div>

				<p
					class="mt-2 max-w-[560px] text-sm leading-relaxed text-[var(--c-text-muted)]"
				>
					<span [translate]="metaDescription"></span>
				</p>
			</div>

			<nav [attr.aria-label]="'Навігація футера'" class="min-w-0">
				<div
					class="text-sm font-semibold text-[var(--c-text-primary)]"
					translate
				>
					Навігація
				</div>

				<ul
					class="mt-3 grid list-none gap-2 p-0 sm:grid-cols-2 lg:grid-cols-3"
				>
					@for (l of links(); track l.to) {
					<li>
						<a
							class="inline-flex items-center gap-2 rounded-[var(--radius-btn)] px-2 py-1 no-underline transition hover:bg-[var(--c-bg-tertiary)] text-[var(--c-text-primary)]"
							[routerLink]="l.to"
						>
							<i class="pi pi-{{ l.icon }}"></i>
							<span class="text-sm" [translate]="l.label"></span>
						</a>
					</li>
					}
				</ul>
			</nav>
		</div>

		<div
			class="mt-6 pt-4 border-t border-[var(--c-border)] text-xs text-[var(--c-text-muted)]"
		>
			<span>? {{ year }} Web Art Work, </span>
			<span translate>усі права захищено</span>
		</div>
	</div>
</footer>
