<h1 class="demo-page__title">Toast</h1>

<p-toast />

<section class="demo-section">
	<h2 class="demo-section__title">Severities</h2>
	<div class="demo-section__row">
		<p-button label="Success" severity="success" (onClick)="show('success')" />
		<p-button label="Info" severity="info" (onClick)="show('info')" />
		<p-button label="Warn" severity="warn" (onClick)="show('warn')" />
		<p-button label="Error" severity="danger" (onClick)="show('error')" />
	</div>
</section>
