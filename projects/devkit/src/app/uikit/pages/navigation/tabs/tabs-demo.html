<h1 class="demo-page__title">Tabs</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Basic</h2>
	<p-tabs value="0">
		<p-tablist>
			<p-tab value="0">Header I</p-tab>
			<p-tab value="1">Header II</p-tab>
			<p-tab value="2">Header III</p-tab>
		</p-tablist>
		<p-tabpanels>
			<p-tabpanel value="0">
				<p style="margin: 0">Content of tab 1.</p>
			</p-tabpanel>
			<p-tabpanel value="1">
				<p style="margin: 0">Content of tab 2.</p>
			</p-tabpanel>
			<p-tabpanel value="2">
				<p style="margin: 0">Content of tab 3.</p>
			</p-tabpanel>
		</p-tabpanels>
	</p-tabs>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Scrollable</h2>
	<p-tabs value="0" [scrollable]="true">
		<p-tablist>
			@for (i of [0, 1, 2, 3, 4, 5, 6, 7]; track i) {
				<p-tab [value]="i">Header {{ i + 1 }}</p-tab>
			}
		</p-tablist>
		<p-tabpanels>
			@for (i of [0, 1, 2, 3, 4, 5, 6, 7]; track i) {
				<p-tabpanel [value]="i">
					<p style="margin: 0">Content of tab {{ i + 1 }}.</p>
				</p-tabpanel>
			}
		</p-tabpanels>
	</p-tabs>
</section>
