<h1 class="demo-page__title">Menu in Context</h1>

<p class="demo-page__note">
	Menubar, breadcrumb and panel menu shown together as a real navigation shell instead of
	isolated controls.
</p>

<section class="demo-section">
	<p-menubar [model]="topNav" />
</section>

<section class="demo-section" style="display: flex; gap: 1.5rem">
	<p-panelMenu [model]="sideNav" style="width: 16rem; flex-shrink: 0" />
	<div style="flex: 1">
		<p-breadcrumb [model]="crumb" [home]="home" />
		<p style="margin-top: 1rem">Page content for the selected section would render here.</p>
	</div>
</section>
