<h1 class="demo-page__title">Toolbar</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Basic</h2>
	<p-toolbar>
		<ng-template #start>
			<p-button icon="pi pi-plus" text />
			<p-button icon="pi pi-print" text />
		</ng-template>
		<ng-template #end>
			<p-button label="Save" icon="pi pi-check" />
		</ng-template>
	</p-toolbar>
</section>
