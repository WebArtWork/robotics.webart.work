<h1 class="demo-page__title">ButtonGroup</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Basic</h2>
	<p-buttonGroup>
		<p-button label="Save" icon="pi pi-check" />
		<p-button label="Delete" icon="pi pi-trash" />
		<p-button label="Cancel" icon="pi pi-times" />
	</p-buttonGroup>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Outlined</h2>
	<p-buttonGroup>
		<p-button label="1" [outlined]="true" />
		<p-button label="2" [outlined]="true" />
		<p-button label="3" [outlined]="true" />
	</p-buttonGroup>
</section>
