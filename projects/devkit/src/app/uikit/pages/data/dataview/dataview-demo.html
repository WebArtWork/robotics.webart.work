<h1 class="demo-page__title">DataView</h1>

<section class="demo-section">
	<h2 class="demo-section__title">List Layout</h2>
	<p-dataView [value]="products()" layout="list">
		<ng-template #list let-items>
			<div style="display: flex; flex-direction: column; gap: 0.5rem">
				@for (item of items; track item.id) {
					<div style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem; border: 1px solid var(--p-content-border-color)">
						<span style="flex: 1">{{ item.name }}</span>
						<p-tag [value]="item.inventoryStatus" [severity]="severity(item.inventoryStatus)" />
						<span style="width: 4rem; text-align: right">${{ item.price }}</span>
						<p-button icon="pi pi-shopping-cart" size="small" />
					</div>
				}
			</div>
		</ng-template>
	</p-dataView>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Grid Layout</h2>
	<p-dataView [value]="products()" layout="grid">
		<ng-template #grid let-items>
			<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem">
				@for (item of items; track item.id) {
					<div style="border: 1px solid var(--p-content-border-color); border-radius: 6px; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem">
						<h3 style="margin: 0">{{ item.name }}</h3>
						<p-tag [value]="item.inventoryStatus" [severity]="severity(item.inventoryStatus)" />
						<div style="font-weight: 600">${{ item.price }}</div>
						<p-button label="Add to Cart" icon="pi pi-shopping-cart" size="small" />
					</div>
				}
			</div>
		</ng-template>
	</p-dataView>
</section>
