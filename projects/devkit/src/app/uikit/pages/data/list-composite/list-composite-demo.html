<h1 class="demo-page__title">List</h1>

<p class="demo-page__note">
	A realistic list pattern built on DataView, with an image placeholder, tags and a per-row
	action, not just the bare component defaults.
</p>

<section class="demo-section">
	<p-dataView [value]="products()" layout="list">
		<ng-template #list let-items>
			<div style="display: flex; flex-direction: column; gap: 0.75rem">
				@for (item of items; track item.id) {
					<div
						style="display: flex; align-items: center; gap: 1rem; padding: 1rem; border: 1px solid var(--p-content-border-color); border-radius: 6px"
					>
						<div style="width: 4rem; height: 4rem; border-radius: 6px; flex-shrink: 0" [style.background]="item.color"></div>
						<div style="flex: 1">
							<div style="font-weight: 600">{{ item.name }}</div>
							<div style="color: var(--p-text-muted-color); font-size: 0.875rem">{{ item.description }}</div>
							<p-tag [value]="item.inventoryStatus" [severity]="severity(item.inventoryStatus)" style="margin-top: 0.25rem" />
						</div>
						<div style="text-align: right; display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end">
							<span style="font-weight: 600; font-size: 1.125rem">${{ item.price }}</span>
							<p-button icon="pi pi-shopping-cart" size="small" [disabled]="item.inventoryStatus === 'OUTOFSTOCK'" />
						</div>
					</div>
				}
			</div>
		</ng-template>
	</p-dataView>
</section>
