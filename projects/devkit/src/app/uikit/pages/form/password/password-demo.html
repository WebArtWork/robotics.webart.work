<h1 class="demo-page__title">Password</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Basic</h2>
	<p-password [(ngModel)]="value" />
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Toggle Mask</h2>
	<p-password [ngModel]="'secret'" [toggleMask]="true" />
</section>

<section class="demo-section">
	<h2 class="demo-section__title">No Feedback</h2>
	<p-password [ngModel]="''" [feedback]="false" />
</section>

<section class="demo-section">
	<h2 class="demo-section__title">States</h2>
	<div class="demo-section__row">
		<p-password [ngModel]="'disabled'" [disabled]="true" />
		<p-password [ngModel]="''" [invalid]="true" />
	</div>
</section>
