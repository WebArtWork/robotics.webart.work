<h1 class="demo-page__title">ToggleSwitch</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Basic</h2>
	<p-toggleswitch [(ngModel)]="checked" />
</section>

<section class="demo-section">
	<h2 class="demo-section__title">States</h2>
	<div class="demo-section__row">
		<p-toggleswitch [ngModel]="true" [disabled]="true" />
		<p-toggleswitch [ngModel]="false" [invalid]="true" />
	</div>
</section>
