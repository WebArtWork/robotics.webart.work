<h1 class="demo-page__title">FloatLabel</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Basic (over)</h2>
	<p-floatlabel>
		<input pInputText id="fl-basic" [(ngModel)]="value" />
		<label for="fl-basic">Username</label>
	</p-floatlabel>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">In</h2>
	<p-floatlabel variant="in">
		<input pInputText id="fl-in" [(ngModel)]="value" />
		<label for="fl-in">Username</label>
	</p-floatlabel>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">On</h2>
	<p-floatlabel variant="on">
		<input pInputText id="fl-on" [(ngModel)]="value" />
		<label for="fl-on">Username</label>
	</p-floatlabel>
</section>
