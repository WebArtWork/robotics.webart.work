<h1 class="demo-page__title">IconField</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Left Icon</h2>
	<p-iconField>
		<p-inputIcon styleClass="pi pi-search" />
		<input type="text" pInputText placeholder="Search" />
	</p-iconField>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Right Icon</h2>
	<p-iconField iconPosition="right">
		<input type="text" pInputText placeholder="Search" />
		<p-inputIcon styleClass="pi pi-spinner pi-spin" />
	</p-iconField>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Both Sides</h2>
	<p-iconField>
		<p-inputIcon styleClass="pi pi-user" />
		<input type="text" pInputText placeholder="Username" />
	</p-iconField>
	<p-iconField iconPosition="right">
		<input type="text" pInputText placeholder="Username" />
		<p-inputIcon styleClass="pi pi-check" />
	</p-iconField>
</section>
