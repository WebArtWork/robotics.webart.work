<h1 class="demo-page__title">InputGroup</h1>

<section class="demo-section">
	<h2 class="demo-section__title">Text Addon</h2>
	<p-inputGroup>
		<p-inputGroupAddon>@</p-inputGroupAddon>
		<input type="text" pInputText placeholder="Username" />
	</p-inputGroup>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Icon Addon</h2>
	<p-inputGroup>
		<p-inputGroupAddon>
			<i class="pi pi-user"></i>
		</p-inputGroupAddon>
		<input type="text" pInputText placeholder="Username" />
	</p-inputGroup>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Multiple Addons</h2>
	<p-inputGroup>
		<p-inputGroupAddon>$</p-inputGroupAddon>
		<input type="text" pInputText placeholder="Price" />
		<p-inputGroupAddon>.00</p-inputGroupAddon>
	</p-inputGroup>
</section>

<section class="demo-section">
	<h2 class="demo-section__title">Button Addon</h2>
	<p-inputGroup>
		<input type="text" pInputText placeholder="Keyword" />
		<p-button icon="pi pi-search" />
	</p-inputGroup>
</section>
