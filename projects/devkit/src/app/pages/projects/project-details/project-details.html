<div class="project-details">
	<h1>Website Redesign</h1>

	<p-card>
		<p-tabs value="0">
			<p-tablist>
				<p-tab value="0">Activity</p-tab>
				<p-tab value="1">Tasks</p-tab>
			</p-tablist>
			<p-tabpanels>
				<p-tabpanel value="0">
					<p-timeline [value]="activity">
						<ng-template let-event #content>
							<div style="font-weight: 600">{{ event.status }}</div>
							<div style="color: var(--p-text-muted-color); font-size: 0.875rem">
								{{ event.date }}
							</div>
						</ng-template>
						<ng-template let-event #marker>
							<span
								style="display: flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border-radius: 50%; color: #fff"
								[style.background]="event.color"
							>
								<i [class]="event.icon"></i>
							</span>
						</ng-template>
					</p-timeline>
				</p-tabpanel>
				<p-tabpanel value="1">
					<p-table [value]="tasks">
						<ng-template #header>
							<tr>
								<th>Task</th>
								<th>Assignee</th>
								<th>Status</th>
							</tr>
						</ng-template>
						<ng-template #body let-task>
							<tr>
								<td>{{ task.task }}</td>
								<td>{{ task.assignee }}</td>
								<td><p-tag [value]="task.statusLabel" [severity]="task.status" /></td>
							</tr>
						</ng-template>
					</p-table>
				</p-tabpanel>
			</p-tabpanels>
		</p-tabs>
	</p-card>
</div>
