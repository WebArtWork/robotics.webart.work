<div class="orders">
	<h1>Orders</h1>
	<p-card>
		<p-table
			#dt
			[value]="orders"
			[paginator]="true"
			[rows]="5"
			[globalFilterFields]="['id', 'customer', 'statusLabel']"
		>
			<ng-template #caption>
				<div class="orders__toolbar">
					<p-iconfield>
						<p-inputicon class="pi pi-search" />
						<input
							pInputText
							type="text"
							placeholder="Search orders"
							(input)="onSearch($any($event.target).value)"
						/>
					</p-iconfield>
				</div>
			</ng-template>
			<ng-template #header>
				<tr>
					<th pSortableColumn="id">Order <p-sortIcon field="id" /></th>
					<th pSortableColumn="customer">Customer <p-sortIcon field="customer" /></th>
					<th pSortableColumn="date">Date <p-sortIcon field="date" /></th>
					<th>Total</th>
					<th>Status</th>
					<th></th>
				</tr>
			</ng-template>
			<ng-template #body let-order>
				<tr>
					<td>{{ order.id }}</td>
					<td>{{ order.customer }}</td>
					<td>{{ order.date }}</td>
					<td>{{ order.total }}</td>
					<td><p-tag [value]="order.statusLabel" [severity]="order.status" /></td>
					<td>
						<p-button
							icon="pi pi-eye"
							[text]="true"
							[routerLink]="['/ecommerce/order-details']"
						/>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</p-card>
</div>
