<div class="products">
	<div class="products__header">
		<h1>Products</h1>
		<p-button label="New Product" icon="pi pi-plus" [routerLink]="['/ecommerce/product-create-edit']" />
	</div>

	<p-card>
		<p-table [value]="products" [paginator]="true" [rows]="5">
			<ng-template #header>
				<tr>
					<th>Product</th>
					<th>Category</th>
					<th>Price</th>
					<th>Stock</th>
					<th>Status</th>
					<th></th>
				</tr>
			</ng-template>
			<ng-template #body let-product>
				<tr>
					<td>{{ product.name }}</td>
					<td>{{ product.category }}</td>
					<td>{{ product.price }}</td>
					<td>{{ product.stock }}</td>
					<td><p-tag [value]="product.statusLabel" [severity]="product.status" /></td>
					<td>
						<p-button
							icon="pi pi-pencil"
							[text]="true"
							[routerLink]="['/ecommerce/product-create-edit']"
						/>
					</td>
				</tr>
			</ng-template>
		</p-table>
	</p-card>
</div>
