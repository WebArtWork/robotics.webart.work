<div class="dashboard">
	<div class="dashboard__stats">
		@for (stat of stats; track stat.label) {
			<p-card class="dashboard__stat-card">
				<div class="dashboard__stat">
					<i class="dashboard__stat-icon" [class]="stat.icon"></i>
					<div>
						<div class="dashboard__stat-value">{{ stat.value }}</div>
						<div class="dashboard__stat-label">{{ stat.label }}</div>
					</div>
				</div>
			</p-card>
		}
	</div>

	<p-card header="Recent Orders" class="dashboard__orders">
		<p-table [value]="orders">
			<ng-template #header>
				<tr>
					<th>Order</th>
					<th>Customer</th>
					<th>Total</th>
					<th>Status</th>
				</tr>
			</ng-template>
			<ng-template #body let-order>
				<tr>
					<td>{{ order.id }}</td>
					<td>{{ order.customer }}</td>
					<td>{{ order.total }}</td>
					<td><p-tag [value]="order.status" [severity]="order.status" /></td>
				</tr>
			</ng-template>
		</p-table>
	</p-card>
</div>
