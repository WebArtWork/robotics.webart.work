<div class="profile">
	<p-card class="profile__card">
		<div class="profile__header">
			<p-avatar label="AL" size="xlarge" shape="circle" class="profile__avatar" />
			<div>
				<h1 class="profile__name">Ada Lovelace</h1>
				<p class="profile__title">Frontend Architect</p>
			</div>
		</div>

		<p-divider />

		<div class="profile__stats">
			@for (stat of stats; track stat.label) {
				<div class="profile__stat">
					<div class="profile__stat-value">{{ stat.value }}</div>
					<div class="profile__stat-label">{{ stat.label }}</div>
				</div>
			}
		</div>

		<p-divider />

		<div class="profile__tags">
			@for (tag of tags; track tag) {
				<p-tag [value]="tag" severity="secondary" />
			}
		</div>
	</p-card>
</div>
